# Configuration for Molecular RL Reward Formulations
# Project: Reinforcement Learning for Drug-Likeness Optimization of Small Molecules
# Course: 22AIE401

baseline_reward:
  step_cost: 0.01
  sim_threshold: 0.4
  sim_penalty_weight: 10.0
  max_sas_base: 4.5
  sas_penalty_weight: 1.0
  invalid_penalty: -1.0
  terminal_bonus: 10.0
  success_delta_qed: 0.1
  success_min_sim: 0.4

adaptive_reward:
  step_cost: 0.01
  sim_threshold: 0.4
  sim_margin_buffer: 0.15          # Buffer where soft penalty begins (0.40 to 0.55)
  sim_soft_penalty_weight: 2.0     # Quadratic penalty within buffer
  sim_hard_penalty_weight: 10.0    # Linear penalty when < 0.40
  sim_violation_base: 2.0          # Base penalty at boundary for continuity
  max_sas_base: 4.5
  sas_margin_buffer: 0.50          # Buffer where soft penalty begins
  sas_soft_penalty_weight: 1.0     # Quadratic penalty within buffer
  sas_hard_penalty_weight: 5.0     # Linear penalty when > allowed
  sas_violation_base: 1.0          # Base penalty at boundary for continuity
  headroom_min_epsilon: 0.05       # Prevents division by zero when q0 is near 1.0
  headroom_weight: 1.0
  invalid_penalty: -1.0
  terminal_bonus: 10.0
  success_delta_qed: 0.1
  success_min_sim: 0.4
